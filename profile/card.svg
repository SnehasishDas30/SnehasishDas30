<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1000"
     height="520"
     viewBox="0 0 1000 520">

  <defs>

    <!-- Dark overlay -->
    <linearGradient id="overlay"
                    x1="0"
                    y1="0"
                    x2="0"
                    y2="1">
      <stop offset="0" stop-color="#000000" stop-opacity="0.20"/>
      <stop offset="0.55" stop-color="#000000" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#0d1117" stop-opacity="0.98"/>
    </linearGradient>

    <!-- Card background -->
    <linearGradient id="card"
                    x1="0"
                    y1="0"
                    x2="1"
                    y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#16232b"/>
    </linearGradient>

    <!-- Avatar circle -->
    <clipPath id="avatarClip">
      <circle cx="125" cy="270" r="78"/>
    </clipPath>

    <!-- Avatar border -->
    <filter id="shadow"
            x="-50%"
            y="-50%"
            width="200%"
            height="200%">
      <feDropShadow
        dx="0"
        dy="5"
        stdDeviation="8"
        flood-color="#000000"
        flood-opacity="0.65"/>
    </filter>

  </defs>

  <!-- ================= BACKGROUND ================= -->

  <rect
    x="0"
    y="0"
    width="1000"
    height="520"
    rx="24"
    fill="url(#card)"
  />

  <!-- Animated GIF background -->
<image
  href="https://raw.githubusercontent.com/SnehasishDas30/SnehasishDas30/main/profile-banner.gif"
  x="0"
  y="0"
  width="1000"
  height="300"
  preserveAspectRatio="xMidYMid slice"
/>

  <!-- Dark overlay over GIF -->
  <rect
    x="0"
    y="0"
    width="1000"
    height="300"
    fill="url(#overlay)"
  />

  <!-- ================= AVATAR ================= -->

  <circle
    cx="125"
    cy="270"
    r="88"
    fill="#0d1117"
    filter="url(#shadow)"
  />

<image
  href="../profile-photo.png"
  xlink:href="../profile-photo.png"
  x="47"
  y="192"
  width="156"
  height="156"
  preserveAspectRatio="xMidYMid slice"
  clip-path="url(#avatarClip)"
/>

<circle
  cx="125"
  cy="270"
  r="82"
  fill="none"
  stroke="#00f7ff"
  stroke-width="5"
/>

  <!-- ================= NAME ================= -->

  <text
    x="235"
    y="235"
    fill="#ffffff"
    font-family="Arial, Helvetica, sans-serif"
    font-size="38"
    font-weight="700">
    Snehasish Das
  </text>

  <text
    x="238"
    y="270"
    fill="#9aa7b2"
    font-family="Arial, Helvetica, sans-serif"
    font-size="19">
    @SnehasishDas30
  </text>

  <!-- ================= TAGS ================= -->

  <rect
    x="235"
    y="290"
    width="210"
    height="34"
    rx="17"
    fill="#203a43"
  />

  <text
    x="340"
    y="313"
    text-anchor="middle"
    fill="#00f7ff"
    font-family="Arial, Helvetica, sans-serif"
    font-size="15"
    font-weight="600">
    Full Stack Developer
  </text>

  <rect
    x="455"
    y="290"
    width="155"
    height="34"
    rx="17"
    fill="#203a43"
  />

  <text
    x="532"
    y="313"
    text-anchor="middle"
    fill="#00f7ff"
    font-family="Arial, Helvetica, sans-serif"
    font-size="15"
    font-weight="600">
    AI Enthusiast
  </text>

  <rect
    x="620"
    y="290"
    width="190"
    height="34"
    rx="17"
    fill="#203a43"
  />

  <text
    x="715"
    y="313"
    text-anchor="middle"
    fill="#00f7ff"
    font-family="Arial, Helvetica, sans-serif"
    font-size="15"
    font-weight="600">
    MERN Stack Learner
  </text>

  <!-- ================= STATS ================= -->

  <rect
    x="40"
    y="380"
    width="920"
    height="100"
    rx="18"
    fill="#111820"
    stroke="#263640"
    stroke-width="1"
  />

  <!-- Followers -->

  <text
    x="155"
    y="415"
    text-anchor="middle"
    fill="#8b949e"
    font-family="Arial, Helvetica, sans-serif"
    font-size="14"
    font-weight="600">
    FOLLOWERS
  </text>

  <text
    x="155"
    y="451"
    text-anchor="middle"
    fill="#ffffff"
    font-family="Arial, Helvetica, sans-serif"
    font-size="25"
    font-weight="700">
    GitHub
  </text>

  <!-- Repository -->

  <text
    x="385"
    y="415"
    text-anchor="middle"
    fill="#8b949e"
    font-family="Arial, Helvetica, sans-serif"
    font-size="14"
    font-weight="600">
    REPOSITORIES
  </text>

  <text
    x="385"
    y="451"
    text-anchor="middle"
    fill="#ffffff"
    font-family="Arial, Helvetica, sans-serif"
    font-size="25"
    font-weight="700">
    24
  </text>

  <!-- Stars -->

  <text
    x="615"
    y="415"
    text-anchor="middle"
    fill="#8b949e"
    font-family="Arial, Helvetica, sans-serif"
    font-size="14"
    font-weight="600">
    STARS
  </text>

  <text
    x="615"
    y="451"
    text-anchor="middle"
    fill="#ffffff"
    font-family="Arial, Helvetica, sans-serif"
    font-size="25"
    font-weight="700">
    GitHub
  </text>

  <!-- Contributions -->

  <text
    x="845"
    y="415"
    text-anchor="middle"
    fill="#8b949e"
    font-family="Arial, Helvetica, sans-serif"
    font-size="14"
    font-weight="600">
    CONTRIBUTIONS
  </text>

  <text
    x="845"
    y="451"
    text-anchor="middle"
    fill="#00f7ff"
    font-family="Arial, Helvetica, sans-serif"
    font-size="25"
    font-weight="700">
    ACTIVE
  </text>

</svg>
