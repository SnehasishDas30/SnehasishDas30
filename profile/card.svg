<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1000"
     height="520"
     viewBox="0 0 1000 520">

  <defs>

    <!-- Dark overlay -->
    <linearGradient id="overlay"
                    x1="0"
                    y1="0"
                    x2="0"
                    y2="1">

      <stop offset="0"
            stop-color="#000000"
            stop-opacity="0.15"/>

      <stop offset="0.55"
            stop-color="#000000"
            stop-opacity="0.45"/>

      <stop offset="1"
            stop-color="#0d1117"
            stop-opacity="0.98"/>

    </linearGradient>


    <!-- Card background -->
    <linearGradient id="card"
                    x1="0"
                    y1="0"
                    x2="1"
                    y2="1">

      <stop offset="0"
            stop-color="#0d1117"/>

      <stop offset="1"
            stop-color="#16232b"/>

    </linearGradient>


    <!-- Avatar clipping -->
    <clipPath id="avatarClip">

      <circle
        cx="125"
        cy="270"
        r="78"/>

    </clipPath>


    <!-- Avatar shadow -->
    <filter id="shadow"
            x="-50%"
            y="-50%"
            width="200%"
            height="200%">

      <feDropShadow
        dx="0"
        dy="5"
        stdDeviation="8"
        flood-color="#000000"
        flood-opacity="0.65"/>

    </filter>

  </defs>


  <!-- ================================================= -->
  <!-- CARD BACKGROUND -->
  <!-- ================================================= -->

  <rect
    x="0"
    y="0"
    width="1000"
    height="520"
    rx="24"
    fill="url(#card)"/>


  <!-- ================================================= -->
  <!-- ANIMATED GIF BACKGROUND -->
  <!-- IMPORTANT:
       GIF is in repository ROOT,
       card.svg is inside /profile/
  -->
  <!-- ================================================= -->

  <image
    x="0"
    y="0"
    width="1000"
    height="300"
    preserveAspectRatio="xMidYMid slice"
    href="https://raw.githubusercontent.com/SnehasishDas30/SnehasishDas30/main/profile-banner.gif"
    xlink:href="https://raw.githubusercontent.com/SnehasishDas30/SnehasishDas30/main/profile-banner.gif"/>


  <!-- Dark overlay -->
  <rect
    x="0"
    y="0"
    width="1000"
    height="300"
    fill="url(#overlay)"/>


  <!-- ================================================= -->
  <!-- AVATAR BACKGROUND -->
  <!-- ================================================= -->

  <circle
    cx="125"
    cy="270"
    r="88"
    fill="#0d1117"
    filter="url(#shadow)"/>


  <!-- ================================================= -->
  <!-- PROFILE PHOTO -->
  <!-- IMPORTANT:
       Actual file:
       /profile/profile-photo.png
  -->
  <!-- ================================================= -->

  <image
    x="47"
    y="192"
    width="156"
    height="156"
    preserveAspectRatio="xMidYMid slice"
    clip-path="url(#avatarClip)"
    href="https://raw.githubusercontent.com/SnehasishDas30/SnehasishDas30/main/profile/profile-photo.png"
    xlink:href="https://raw.githubusercontent.com/SnehasishDas30/SnehasishDas30/main/profile/profile-photo.png"/>


  <!-- Avatar border -->

  <circle
    cx="125"
    cy="270"
    r="82"
    fill="none"
    stroke="#00f7ff"
    stroke-width="5"/>


  <!-- ================================================= -->
  <!-- NAME -->
  <!-- ================================================= -->

  <text
    x="235"
    y="235"
    fill="#ffffff"
    font-family="Arial, Helvetica, sans-serif"
    font-size="38"
    font-weight="700">

    Snehasish Das

  </text>


  <!-- Username -->

  <text
    x="238"
    y="270"
    fill="#9aa7b2"
    font-family="Arial, Helvetica, sans-serif"
    font-size="19">

    @SnehasishDas30

  </text>


  <!-- ================================================= -->
  <!-- TAG 1 -->
