name: Update GitHub Card

on:
  schedule:
    - cron: "0 */6 * * *"

  workflow_dispatch:

jobs:
  update-card:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get GitHub Stats
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -L \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/users/SnehasishDas30 \
            -o github-data.json

      - name: Update Card
        run: |
          FOLLOWERS=$(python -c "import json; print(json.load(open('github-data.json'))['followers'])")
          REPOSITORIES=$(python -c "import json; print(json.load(open('github-data.json'))['public_repos'])")

          sed -i "s/{{FOLLOWERS}}/$FOLLOWERS/g" profile/card.svg
          sed -i "s/{{REPOSITORIES}}/$REPOSITORIES/g" profile/card.svg

      - name: Commit Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/card.svg

          git diff --cached --quiet || git commit -m "Update GitHub card stats"

          git push
