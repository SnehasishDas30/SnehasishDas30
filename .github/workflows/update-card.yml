name: Update GitHub Card

on:
  schedule:
    - cron: "0 */6 * * *"

  workflow_dispatch:

jobs:
  update-card:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get GitHub Stats
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |

          USERNAME="SnehasishDas30"

          FOLLOWERS=$(curl -s \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/users/$USERNAME" \
            | python -c "import sys,json; print(json.load(sys.stdin)['followers'])")

          REPOSITORIES=$(curl -s \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/users/$USERNAME/repos?per_page=100&page=1" \
            | python -c "import sys,json; print(len(json.load(sys.stdin)))")

          echo "Followers: $FOLLOWERS"
          echo "Repositories: $REPOSITORIES"

          echo "FOLLOWERS=$FOLLOWERS" >> $GITHUB_ENV
          echo "REPOSITORIES=$REPOSITORIES" >> $GITHUB_ENV


      - name: Update Card
        run: |

          sed -i "s/{{FOLLOWERS}}/$FOLLOWERS/g" profile/card.svg
          sed -i "s/{{REPOSITORIES}}/$REPOSITORIES/g" profile/card.svg


      - name: Commit Changes
        run: |

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/card.svg

          git diff --cached --quiet || git commit -m "Update GitHub card stats"

          git push
